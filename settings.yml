blocked_sections:
  type: objects
  schema:
    name: tier
    identifier: key
    properties:
      key:
        type: string
        required: true
        validations:
          max_length: 40
      allowed_groups:
        type: groups
      categories:
        type: categories
      paths:
        type: string
      cta_url:
        type: string
      # plain string, not type: icon — the icon list is validated server-side
      # and `ticket` is registered client-side by another initializer
      cta_icon:
        type: string
      hide:
        type: boolean
        default: false
  default:
    - key: "tl2"
      allowed_groups: []
      categories: [57]
      paths: ""
      cta_url: "/s"
      cta_icon: "ticket"
      hide: false
    - key: "tl3"
      allowed_groups: []
      categories: [64, 5, 59]
      paths: "/upcoming-events, /resenha/r/lounge"
      cta_url: "/s"
      cta_icon: "ticket"
      hide: false

disable_discourse_keyboard_shortcuts:
  type: bool
  default: false
  description: "Disables Discourse's own keyboard shortcuts (j/k navigation, ?, g-sequences, etc). Native browser/OS behavior (arrow keys, Ctrl+C/V, Escape, Space, Enter) is never affected."
