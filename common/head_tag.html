<!-- Discourse inside the blog's comments iframe: follow the blog's light/dark
  theme and report our height so the iframe shows the whole thread.

  The blog half lives in ghost-headline-theme-nautas, assets/js/discourse-embed.js:
  it waits for the "discourse-embed-ready" ping below, keeps the event.source,
  posts {theme: "light"|"dark"} on every change, and sizes the iframe from the
  {type: "nautas-embed-height"} reports.

  This lived in common/embedded_header.html first, which was silently doing
  nothing: that field only renders on the lightweight /embed/comments page,
  and the blog sets fullApp: true, so the iframe loads the whole app instead.
  head_tag is the field that runs there. If fullApp is ever dropped, this has
  to move back. -->
<script>
  (function () {
    var BLOG_ORIGIN = "https://criptonautas.co";

    // head_tag renders on every forum page, so do nothing unless we are framed.
    if (window.parent === window) {
      return;
    }

    function announce() {
      // Target origin stays "*": the payload is a fixed, non-sensitive string,
      // and pinning it would silently break the handshake if the embed is ever
      // served from another allowed host (www, staging). The security boundary
      // is the incoming check below, where the data actually matters.
      window.parent.postMessage("discourse-embed-ready", "*");
    }

    // Guard the race: if this runs after load has already fired, a plain
    // addEventListener("load") never runs and the blog never learns we exist.
    if (document.readyState === "complete") {
      announce();
    } else {
      window.addEventListener("load", announce);
    }

    // Report the content height so the blog sizes the iframe to the whole
    // thread instead of a fixed box with an inner scrollbar. Once the iframe is
    // that tall the post stream's bottom sentinel is in view, so Discourse
    // keeps loading until every reply is shown. "*" for the same reason as
    // announce(): a height is not sensitive.
    //
    // Grows but never shrinks: the document is always at least as tall as the
    // iframe viewport, so scrollHeight cannot drop below the current height.
    var lastHeight = 0;
    function reportHeight() {
      var height = document.documentElement.scrollHeight;
      if (Math.abs(height - lastHeight) < 2) {
        return;
      }
      lastHeight = height;
      window.parent.postMessage({ type: "nautas-embed-height", height: height }, "*");
    }

    function observeHeight() {
      new ResizeObserver(reportHeight).observe(document.body);
      reportHeight();
    }

    // head_tag runs before <body> exists.
    if (document.body) {
      observeHeight();
    } else {
      document.addEventListener("DOMContentLoaded", observeHeight);
    }

    window.addEventListener("message", function (event) {
      // Without this, any page that frames Discourse can drive its theme.
      if (event.origin !== BLOG_ORIGIN) {
        return;
      }

      var theme = event.data && event.data.theme;
      if (theme === "dark" || theme === "light") {
        document.documentElement.setAttribute("data-theme", theme);
      }
    });
  })();
</script>
